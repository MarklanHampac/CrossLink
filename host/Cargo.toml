[package]
name = "crosslink-host"
version = "0.1.0"
edition = "2021"
authors = ["CrossLink Developers"]
description = "Lightweight Windows Host for CrossLink Cross-Device Input Sharing"

[dependencies]
slint = { version = "1.18", features = ["compat-1-18", "std"] }
slint-build = "1.18"
tokio = { version = "1.38", features = ["net", "sync", "rt-multi-thread", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }
local-ip-address = "0.6"
crossbeam-channel = "0.5"
base64 = "0.22"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true