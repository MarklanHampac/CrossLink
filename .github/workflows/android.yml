# GitHub Actions workflow for CrossLink APK build
# Place this at: .github/workflows/android.yml

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build release APK
      run: |
        echo "Signing config will be needed for release builds"
        echo "Debug build should be sufficient for testing"

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: crosslink-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Display APK info
      run: |
        ls -la app/build/outputs/apk/debug/
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "APK built successfully"
          echo "Size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
        fi